[project]
name = "gogdl"
version = "0.1.0"
description = "Resume-fähiger Downloader für die eigene GOG.com-Bibliothek mit Aktualitätsprüfung und automatischem Aufräumen alter Versionen"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
gogdl = "gogdl.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gogdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
